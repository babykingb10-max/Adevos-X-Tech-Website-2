<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/theme.js"></script>
<title>Admin Login | Adevos-X Tech</title>
<link rel="manifest" href="/admin/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<main class="container" style="max-width:380px;padding-top:80px;">
  <div class="app-card">
    <h2 style="text-align:center;"><i class="fa-solid fa-user-shield"></i> Admin Access</h2>
    <p class="text-muted" style="text-align:center;margin-bottom:16px;">Adevos-X Tech Control Panel</p>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-control" name="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
  </div>
</main>
<div id="app-overlay"></div>

<script src="/js/config.js"></script>
<script src="/js/ui.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    try {
      const res = await fetch(`${API_BASE_URL}/admin/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      localStorage.setItem('adevos_admin_token', data.token);
      window.location.href = '/admin/';
    } catch (err) {
      UI.showModal('Login Failed', err.message || 'Check your credentials and try again.');
    }
  });
</script>
</body>
</html>
